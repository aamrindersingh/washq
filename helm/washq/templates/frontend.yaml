apiVersion: v1
kind: Service
metadata:
  name: {{ include "washq.fullname" . }}-frontend
  labels:
    {{- include "washq.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      name: http
  selector:
    {{- include "washq.frontendSelector" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "washq.fullname" . }}-frontend
  labels:
    {{- include "washq.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "washq.frontendSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "washq.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: {{ include "washq.image" (dict "Values" .Values "Chart" .Chart "component" "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.containerPort }}
          env:
            # nginx proxies /api here. Same image as compose, different
            # backend address, substituted at container start.
            - name: BACKEND_HOST
              value: "{{ include "washq.fullname" . }}-backend:8000"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
