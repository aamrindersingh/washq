{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "washq.fullname" . }}-postgres
  labels:
    {{- include "washq.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
  selector:
    {{- include "washq.postgresSelector" . | nindent 4 }}
---
# A StatefulSet rather than a Deployment, so the volume follows the pod
# and the database is not wiped on a restart.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "washq.fullname" . }}-postgres
  labels:
    {{- include "washq.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "washq.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "washq.postgresSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "washq.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "washq.postgresSecretName" . }}
          env:
            # The image refuses to initialise into a non-empty directory,
            # and a mounted volume already has lost+found in it.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Stated rather than left to the API server to default, so Argo
        # does not read the defaulted value back as drift.
        volumeMode: Filesystem
        {{- if .Values.postgres.storageClass }}
        storageClassName: {{ .Values.postgres.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
