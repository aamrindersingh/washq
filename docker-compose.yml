services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: washq
      POSTGRES_PASSWORD: washq
      POSTGRES_DB: washq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U washq -d washq"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://washq:washq@postgres:5432/washq
      APP_VERSION: local
    # Migrations run first, then a few machines are seeded so the board is
    # not empty, then the API starts.
    command: >
      sh -c "alembic upgrade head && python seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_HOST: backend:8000
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  pgdata:
