name: CI/CD

# Runs on every push to main. Pull requests get the tests and the scan but
# nothing is published from them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        # A failure here stops the job, so nothing further in the pipeline
        # runs and no image is built or pushed.
        run: pytest -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the bundle
        working-directory: frontend
        run: npm run build

      - name: Check the build produced something
        working-directory: frontend
        run: test -f dist/index.html

  images:
    name: Build, scan and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Both gates have to be green before anything is built.
    needs: [test, frontend-build]
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image: backend
          - name: frontend
            context: ./frontend
            image: frontend

    steps:
      - uses: actions/checkout@v4

      # QEMU lets the amd64 runner also build the arm64 image. Without it
      # the published image is amd64 only, which fails to run on Apple
      # Silicon and on Graviton nodes.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # Built and loaded locally first so Trivy can scan the exact image
      # that would be published. Nothing is pushed before the scan passes.
      # This one is the runner's own architecture, because docker load
      # cannot take a multi-platform result.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.name }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          # Fails the job, which stops the push step below.
          exit-code: "1"
          # CVEs with no released patch cannot be fixed by us. Anything
          # that does have a fix must be fixed, which is why the frontend
          # image runs apk upgrade.
          ignore-unfixed: true
          scanners: vuln

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit SHA so every deployment points at one exact
      # build. There is no latest tag on purpose.
      - name: Push to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # Built for both architectures so the image runs on EKS amd64
          # nodes and on an Apple Silicon laptop.
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: Summary
        if: github.event_name == 'push'
        run: |
          echo "### ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "Pushed \`ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Trivy found no HIGH or CRITICAL issues with a fix available." >> $GITHUB_STEP_SUMMARY
