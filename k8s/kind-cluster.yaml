# Local cluster used to test the chart before touching EKS.
# The control plane node is labelled so ingress-nginx will schedule on it,
# and ports 80 and 443 are mapped out to the host so the ingress is
# reachable at http://washq.local once it is in /etc/hosts.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: washq
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
